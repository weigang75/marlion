# 用于定义项目的构建系统配置。
[build-system]
# 指定构建系统工具的要求。使用 "hatchling" 作为构建系统工具。
requires = ["hatchling"]
# 指定构建系统的后端实现。
build-backend = "hatchling.build"

# 项目相关的各种信息。
[project]
# 项目的名称。
name = "marlion"
# 项目的版本号。
version = "0.2.0"
# 作者信息列表，包含作者的姓名和电子邮件。
authors = [{ name = "weigang" }, { email = "gang.wei@qq.com" }]
# 项目的描述。
description = "神笔码靓，意如其神笔般神奇，融合代码与艺术魅力，呈现靓丽精彩绘图效果。如神笔马良般，能使虚拟创作成实体物件，让作品跃然纸上，生动呈现世人眼前。"
# 项目的 README 文件的名称。
readme = "README.md"
# 许可证信息，包含许可证文件的名称。
license = { file = "LICENSE" }
# 项目所需的 Python 版本。
requires-python = ">=3.8"
# 项目的分类器，用于指定项目的分类标签。例如编程语言、许可证、操作系统等。
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# 项目的依赖列表，指定其他项目或库的依赖关系。
dependencies = [
    "svgwrite==1.4.3",
    "CairoSVG==2.7.1",
    "svgpathtools==1.6.1",
    "shapely==2.0.7",
    "matplotlib==3.5.2",
    "numpy==1.24.4"
]
# pip show svgwrite

# 项目的相关网址（与本项目仓库一致；PyPI 页面左侧栏渲染这些链接）
[project.urls]
# 项目的主页网址。
Homepage = "https://github.com/weigang75"
# 代码仓库。
Repository = "https://github.com/weigang75/marlion"



#[tool.setuptools]
#package-dir = {from="神笔码靓"}
#dist-dir = "安装包"

[tool.hatch.build]
include = ["神笔码靓/神笔库", "神笔码靓/码靓库", "神笔码靓/源创室",
    "神笔码靓/字体/README.md", "神笔码靓/字体/五线谱字体.ttf", "神笔码靓/字体/字体使用免责声明.txt",
    "神笔码靓/资源库/素材/聊天窗口/*", "神笔码靓/资源库/素材/足球纹理/*", "神笔码靓/资源库/国旗/中国国旗.svg",
]
exclude = ["神笔码靓/新手营", "神笔码靓/成果馆", "神笔码靓/神笔库/*.html", "神笔码靓/神笔库/html/*", "神笔码靓/神笔库/py/*",
    "__pycache__/**/*", ".idea", ".git", "*.log",
    ".gitignore", "LICENSE", "pyproject.toml", "README.md", "requirements.txt", "setup.py"]


# 打包使用说明
# https://blog.csdn.net/ouguangqian/article/details/128148295
# 1. 创建README.md文件、创建LICENSE文件
# 2. python -m pip install --upgrade pip
# 3. python -m build      ->  如果 出现 'No module named build' 则先 `pip install build`
# 3. python -m build --wheel --outdir=dist ->  如果 出现 'No module named build' 则先 `pip install build`
# 安装包说明
# 4. cd dist
# 5. pip install marlion-0.2.0-py3-none-any.whl
